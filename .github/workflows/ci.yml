name: CI

on:
  workflow_dispatch:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }} / ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-26,      cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}   # dpf + pugl are private forks
      # DPF's pugl/NanoVG UI needs X11 + GL headers; the xcb/xkb/fontconfig packages are what the
      # vendored VST3 SDK looks for on Linux (as PlainOldSynth's CI).
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # One package list for every Unlikelyware project, as in BUILDING.md
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 git \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libxcb1-dev libx11-xcb-dev libxcb-util-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libasound2-dev libjack-jackd2-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdecor-0-dev libudev-dev \
            libdbus-1-dev libibus-1.0-dev
      # fetch_deps.sh's own `git submodule` clones don't get checkout's token, so hand it to git
      # for the private repos (dpf and its pugl).
      - name: Credentials for the private submodules
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULES_TOKEN}@github.com/erickampman/".insteadOf \
            "https://github.com/erickampman/"
      # Pinned submodules, only the four vst3sdk submodules the build needs, plus patches/.
      - name: Fetch pinned dependency submodules
        run: tools/fetch_deps.sh
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      # The documented steps (BUILDING.md), plus warnings as errors.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRUCKSYNTH_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test (framework self-tests via ctest)
        run: ctest --test-dir build --output-on-failure --timeout 30
